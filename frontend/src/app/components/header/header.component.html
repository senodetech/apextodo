<header class="app-header glass-card">
  <div class="header-left">
    <app-brand-logo layout="horizontal" size="md" subtitle="Workspace"></app-brand-logo>
  </div>

  <!-- Center: Compact Workspace Mode Switcher -->
  <div class="workspace-switcher" *ngIf="authService.isAdmin()">
    <button
      class="switch-btn"
      [class.active]="taskService.dashboardMode() === 'admin'"
      (click)="taskService.setDashboardMode('admin')"
      title="Company-wide organization dashboard"
    >
      <span class="icon">📊</span> Executive View
    </button>
    <button
      class="switch-btn"
      [class.active]="taskService.dashboardMode() === 'personal'"
      (click)="taskService.setDashboardMode('personal')"
      title="My assigned and created tasks"
    >
      <span class="icon">👤</span> My Tasks
    </button>
  </div>

  <div class="header-right">
    <!-- Notifications Bell -->
    <button
      *ngIf="authService.isSuperAdmin()"
      class="btn-icon"
      (click)="openNotificationsModal.emit()"
      title="System Activity & Alerts"
    >
      <span class="bell-icon">🔔</span>
      <span
        *ngIf="notificationService.unreadCount() > 0"
        class="badge-notification"
      >
        {{ notificationService.unreadCount() }}
      </span>
    </button>

    <!-- Admin: Team Management -->
    <button
      *ngIf="authService.isAdmin()"
      class="btn-nav"
      (click)="openUserManagementModal.emit()"
      title="Manage team members & roles"
    >
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
        <circle cx="9" cy="7" r="4"/>
        <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
        <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
      </svg>
      <span>Team</span>
    </button>

    <!-- Admin: Audit Logs Trigger -->
    <button
      *ngIf="authService.isAdmin()"
      class="btn-nav"
      (click)="openAuditLogsModal.emit()"
      title="Security & activity audit logs"
    >
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
      </svg>
      <span>Audit</span>
    </button>

    <!-- Architecture & System Blueprints Magnifier -->
    <button
      class="btn-nav btn-blueprint"
      (click)="openArchitectureDocs()"
      title="Open Interactive Architecture Blueprints & Magnifier"
    >
      <span class="blueprint-icon">🏛️</span>
      <span>Blueprints</span>
    </button>

    <div class="divider-v"></div>

    <!-- User Profile Widget -->
    <div class="user-profile-widget">
      <div
        class="user-avatar"
        [class.avatar-super]="authService.isSuperAdmin()"
        [title]="authService.currentUser()?.email || 'User'"
      >
        <img
          *ngIf="authService.currentUser()?.avatarUrl; else initials"
          [src]="authService.currentUser()?.avatarUrl"
          alt="Avatar"
          class="avatar-img"
          referrerpolicy="no-referrer"
        />
        <ng-template #initials>
          {{ getInitials(authService.currentUser()?.name) }}
        </ng-template>
      </div>
      <div class="user-meta">
        <span class="user-display-name">{{ authService.currentUser()?.name }}</span>
        <span class="badge-role" [ngClass]="getRoleClass(authService.currentUser()?.role)">
          {{ formatRole(authService.currentUser()?.role) }}
        </span>
      </div>

      <button class="btn-logout" (click)="authService.logout()" title="Sign Out">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
      </button>
    </div>
  </div>
</header>
